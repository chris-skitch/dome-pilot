<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img"><title>Yellow and green in turn</title><style>@keyframes a{0%,49.9%{opacity:1}50%,100%{opacity:0}}@keyframes b{0%,49.9%{opacity:0}50%,100%{opacity:1}}.a{animation:a 1.0s infinite}.b{animation:b 1.0s infinite}@media (prefers-reduced-motion: reduce){.a,.b{animation:none}.b{opacity:0}}</style><g class="a"><circle cx="16" cy="16" r="14" fill="#ffcc00" opacity="0.28"/><circle cx="16" cy="16" r="9" fill="#ffcc00" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"/></g><g class="b"><circle cx="16" cy="16" r="14" fill="#33b866" opacity="0.28"/><circle cx="16" cy="16" r="9" fill="#33b866" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2"/></g></svg>