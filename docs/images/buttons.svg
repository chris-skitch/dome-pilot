<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Six unlabelled buttons in a column on the front of the body, left of the two vents. Button 1 is at the top: patrol, arms, prop arm, pair, Wi-Fi mode, power.</title><rect x="20" y="20" width="200" height="206" rx="14" fill="#e5e5ea" stroke="#c7c7cc" stroke-width="1.5"/><text x="44" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">1</text><rect x="56" y="38" width="58" height="16" rx="3" fill="#aeaeb2"/><line x1="226" y1="46" x2="250" y2="46" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="51" font-size="15" font-weight="400" fill="#1c1c1e">Patrol on or off</text><text x="44" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">2</text><rect x="56" y="68" width="58" height="16" rx="3" fill="#aeaeb2"/><line x1="226" y1="76" x2="250" y2="76" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="81" font-size="15" font-weight="400" fill="#1c1c1e">Arms in or out</text><text x="44" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">3</text><rect x="56" y="98" width="58" height="16" rx="3" fill="#aeaeb2"/><line x1="226" y1="106" x2="250" y2="106" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="111" font-size="15" font-weight="400" fill="#1c1c1e">Prop arm up or down</text><text x="44" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">4</text><rect x="56" y="128" width="58" height="16" rx="3" fill="#ffb020"/><line x1="226" y1="136" x2="250" y2="136" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="141" font-size="15" font-weight="600" fill="#1c1c1e">Pair</text><text x="44" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">5</text><rect x="56" y="158" width="58" height="16" rx="3" fill="#ffb020"/><line x1="226" y1="166" x2="250" y2="166" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="171" font-size="15" font-weight="600" fill="#1c1c1e">Wi-Fi mode (hold 2 s)</text><text x="44" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#3a3a3c">6</text><rect x="56" y="188" width="58" height="16" rx="3" fill="#ffb020"/><line x1="226" y1="196" x2="250" y2="196" stroke="#c7c7cc" stroke-width="1" stroke-dasharray="2 3"/><text x="258" y="201" font-size="15" font-weight="600" fill="#1c1c1e">Power</text><rect x="150" y="70" width="38" height="50" rx="8" fill="#c7c7cc"/><rect x="150" y="132" width="38" height="50" rx="8" fill="#c7c7cc"/><text x="169" y="200" text-anchor="middle" font-size="11" fill="#6e6e73">vents</text><text x="120" y="244" text-anchor="middle" font-size="12" fill="#6e6e73">Front of the body</text></svg>